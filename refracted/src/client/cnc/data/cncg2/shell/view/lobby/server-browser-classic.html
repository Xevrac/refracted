<div class="cc-lobby-browser">
    <div class="cc-lobby-browser__head">
        <button type="button" class="cc-lobby__btn cc-lobby__btn--exit" ng-click="closeServerBrowser()">BACK</button>
        <h2 class="cc-lobby-browser__title">Server Browser</h2>
    </div>
    <div class="cc-lobby-browser__panel">
        <div class="cc-info-tip cc-info-tip--page">
            <strong>Coming soon</strong>
            <span>Browse for servers is coming soon.</span>
        </div>
        <div class="cc-lobby-browser__table">
            <div class="cc-lobby-browser__row cc-lobby-browser__row--head">
                <span>Server</span>
                <span>Map</span>
                <span>Players</span>
                <span>State</span>
            </div>
            <div class="cc-lobby-browser__empty">No sessions listed yet.</div>
        </div>
    </div>
</div>
