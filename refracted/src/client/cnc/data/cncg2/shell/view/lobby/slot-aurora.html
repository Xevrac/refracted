<div class="au-lobby__avatar" ng-class="{'au-lobby__avatar--host': slot.isHost || (slot.isLocal && isLobbyHost())}">
    <img ng-src="{{ slotPortrait(slot) }}" cc-fallback-src="{{ generalAvatar(slot) }}" alt="">
</div>
<div class="au-lobby__color-ribbon" ng-if="!slot.invitePending"
     ng-class="{'au-lobby__color-ribbon--pick': canChangeColor(slot)}"
     ng-click="pickColorFromRibbon(slot, $event)"
     data-tip="{{ canChangeColor(slot) ? 'Pick colour' : '' }}"
     ng-style="{'background-color': slot.color}"></div>
<div class="au-lobby__meta">
    <strong ng-class="nameTagClass(slot)">{{ slot.isAi ? 'AI' : (slot.displayName || slot.codename) }}<em
        class="au-lobby__host-tag" ng-if="slot.isHost || (slot.isLocal && isLobbyHost())">Host</em><em
        class="au-lobby__host-tag au-lobby__diff-tag" ng-if="slot.isAi">{{ difficultyLabel(slot) }}</em></strong>
    <span class="au-lobby__slot-mods" ng-if="slotModProgress(slot)">{{ slotModProgress(slot) }}</span>
    <span class="au-lobby__general" ng-if="!slot.invitePending"><img
        ng-src="{{ factionIcon(slot) }}" alt=""><i>{{ slot.faction }}</i><b>{{ slot.codename }}</b></span>
</div>
<div class="au-lobby__slot-side">
    <div class="au-lobby__slot-state">
        <!-- Start location, picked on the battle map; ? = not picked (random). -->
        <span class="au-lobby__start-box"
              ng-if="!slot.invitePending"
              ng-class="{'au-lobby__start-box--set': startpointLabel(slot.startpoint) != '?'}"
              data-tip="{{ startpointLabel(slot.startpoint) == '?' ? 'Random start: pick one on the map' : 'Start location ' + startpointLabel(slot.startpoint) }}">{{ startpointLabel(slot.startpoint) }}</span>
        <div class="au-lobby__ready" ng-class="{on: slot.ready}"
             ng-if="!slot.invitePending && !slot.isAi"
             data-tip="{{ slot.ready ? 'Ready' : 'Not ready' }}"
             data-tip-tone="{{ slot.ready ? 'ready' : 'not-ready' }}"></div>
    </div>
    <div class="au-lobby__slot-tools">
        <button type="button" class="au-lobby__menu-btn"
                data-tip="{{ slot.isAi && isLobbyHost() ? 'Pick difficulty, faction, general and colour' : 'Pick faction, general and colour' }}"
                ng-if="!slot.invitePending"
                ng-click="toggleSlotMenu(teamNum, $index, $event)"
                ng-disabled="slotLocked(slot)"
                ng-class="{open: slotMenu == slotMenuKey(teamNum, $index)}">
            <span class="au-lobby__chevron"></span>
        </button>
        <button type="button" class="au-lobby__kick" ng-if="isLobbyHost()"
                ng-class="{disabled: slot.isLocal}"
                ng-click="clearSlot(teamNum, $index, $event)"
                data-tip="{{ kickTip(slot) }}">&times;</button>
    </div>
</div>
<div class="au-lobby__slot-menu" ng-class="{'au-lobby__slot-menu--up': slotMenuUp}" ng-show="slotMenu == slotMenuKey(teamNum, $index)" ng-click="$event.stopPropagation()">
    <div ng-if="slot.isAi && isLobbyHost()">
        <div class="au-lobby__slot-menu-label">Difficulty</div>
        <div class="au-lobby__pick-row">
            <a href="" class="au-lobby__pick au-lobby__pick--faction" ng-repeat="d in difficultyChoices()"
               ng-class="{active: isDifficulty(slot, d.id)}"
               ng-click="pickDifficulty(slot, d.id, $event)">{{ d.label }}</a>
        </div>
    </div>
    <div class="au-lobby__slot-menu-label">Faction</div>
    <div class="au-lobby__pick-row">
        <a href="" class="au-lobby__pick au-lobby__pick--faction" ng-repeat="f in availableFactions()"
           ng-class="{active: slot.faction == f.code, disabled: !canChangeFaction(slot)}"
           ng-click="setFaction(slot, f.code, $event)"><img ng-src="{{ factionIconFor(f.code) }}" alt="">{{ f.label }}</a>
    </div>
    <div class="au-lobby__slot-menu-label">General</div>
    <div class="au-lobby__pick-row">
        <a href="" class="au-lobby__pick au-lobby__pick--general" ng-repeat="g in availableGenerals(slot)"
           ng-class="{active: slot.general == g.id, disabled: !canChangeGeneral(slot)}"
           ng-click="setGeneral(slot, g.id, $event)"><img ng-src="{{ generalIconSrc(g) }}" alt=""><span>{{ g.label }}</span></a>
    </div>
    <div class="au-lobby__slot-menu-label">Colour</div>
    <div class="au-lobby__slot-colors">
        <button type="button" class="au-lobby__swatch" ng-repeat="c in colors"
                ng-style="{'background-color': c}"
                ng-class="{on: sameHouseColor(slot.color, c), taken: colorTaken(c, slot)}"
                ng-disabled="colorTaken(c, slot) || !canChangeColor(slot)"
                ng-click="setColor(slot, c, $event)"></button>
        <button type="button" class="au-lobby__swatch au-lobby__swatch--rainbow"
                ng-class="{on: isCustomHouseColor(slot)}"
                ng-disabled="!canChangeColor(slot)"
                ng-click="openCustomColorPicker(slot, $event)"
                data-tip="Custom colour"
                data-tip-pos="below"></button>
    </div>
</div>
