<div class="cc-news-widget" ng-hide="activeNewsArticle">
    
    <div class="news-header">
        <img src="images/icon_globe.svg" alt="" class="news-globe-icon">
        <span class="news-title">NEWS</span>
    </div>
    
    <div class="news-subheader">
        The Latest in the world of C&C
    </div>

    <ul class="news-list">
        <li class="news-item clearfix" ng-repeat="news in newsEntries" ng-click="openArticle(news)">
            
            <div class="news-item-thumb" ng-if="news.hasImage">
                <img ng-src="{{ news.image }}" alt="">
            </div>
            
            <div class="news-item-text" ng-class="{'has-thumb': news.hasImage}">
                <span class="news-item-pin" ng-if="news.pinned">&#9650;</span>{{ news.title }}
            </div>
        </li>
        <li class="news-item news-item--empty" ng-hide="newsEntries.length">No news right now.</li>
    </ul>
</div>

<div class="cc-news-full-panel" ng-show="activeNewsArticle">
    
    <h1 class="article-title">{{ activeNewsArticle.title }}</h1>
    <h4 class="article-date">{{ activeNewsArticle.date }}</h4>

    <img class="article-image" ng-if="activeNewsArticle.hasImage" ng-src="{{ activeNewsArticle.image }}" alt="">
    
    <div class="article-content">
        <p class="article-summary" ng-show="activeNewsArticle.summary">{{ activeNewsArticle.summary }}</p>

        <div ng-repeat="block in activeNewsArticle.blocks" ng-switch="block.type">
            <div ng-switch-when="paragraph">
                <p class="article-paragraph" ng-repeat="para in block.paragraphs">{{ para }}</p>
            </div>
            <p ng-switch-when="heading"><span class="article-heading">{{ block.text }}</span></p>
            <ul ng-switch-when="list" class="article-list">
                <li ng-repeat="item in block.items">{{ item.text }}
                    <ul ng-show="item.children.length">
                        <li ng-repeat="child in item.children">{{ child }}</li>
                    </ul>
                </li>
            </ul>
            <hr ng-switch-when="divider" class="article-divider">
        </div>
    </div>

    <button class="btn-back-to-main" ng-click="closeArticle()">BACK TO MAIN</button>

</div>
