<!DOCTYPE html>
<html ng-app="CCApp">
<head>
    <meta charset="utf-8">
    <title>Command &amp; Conquer — Pause Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="lib/angular/angular.min.js"></script>
    <link rel="stylesheet" href="css/options.css">
    <link rel="stylesheet" href="css/themes/aurora.css">
    <link rel="stylesheet" href="css/ingame-menu.css">
    <script src="js/shell-theme.js"></script>
    <script src="js/ingame-menu.js"></script>
    <script src="options.js"></script>
</head>
<body class="cc-theme cc-theme--aurora ingame-aurora" ng-controller="IngameMenuController" ng-cloak>

    <div class="pause-menu" ng-hide="optionsOpen || quittingOpen">
        <button type="button" class="pause-menu-btn" ng-click="openOptions()">OPTIONS</button>
        <button type="button" class="pause-menu-btn" ng-click="openConfirmSurrender()">SURRENDER</button>
        <button type="button" class="pause-menu-btn" ng-click="openConfirmQuit()">QUIT GAME</button>
        <button type="button" class="pause-menu-btn" ng-click="returnToGame()">RETURN TO GAME</button>
    </div>

    <div class="confirm-modal-overlay" ng-show="confirmSurrenderOpen && !optionsOpen">
        <div class="confirm-modal-box">
            <h2 class="confirm-modal-title">Confirm Surrender?</h2>
            <p class="confirm-modal-msg">Are you sure you want to surrender?</p>
            <div class="confirm-modal-actions">
                <button type="button" class="confirm-btn" ng-click="confirmSurrenderYes()">YES</button>
                <button type="button" class="confirm-btn" ng-click="cancelConfirm()">NO</button>
            </div>
        </div>
    </div>

    <div class="confirm-modal-overlay" ng-show="confirmQuitOpen && !optionsOpen && !quittingOpen">
        <div class="confirm-modal-box">
            <h2 class="confirm-modal-title">Confirm Quit?</h2>
            <p class="confirm-modal-msg">Are you sure you want to quit to desktop?</p>
            <div class="confirm-modal-actions">
                <button type="button" class="confirm-btn" ng-click="confirmQuitYes()">YES</button>
                <button type="button" class="confirm-btn" ng-click="cancelConfirm()">NO</button>
            </div>
        </div>
    </div>

    <div class="quit-progress-overlay" ng-show="quittingOpen">
        <div class="quit-progress-box">
            <p class="quit-progress-msg">Quitting game..</p>
        </div>
    </div>

    <div ng-include="'view/options.html'"></div>

</body>
</html>
